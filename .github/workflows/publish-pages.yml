name: Publish mvn site to gh-pages

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - name: Checkout sources 🔰
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Java 17 ⏬
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: 25.0.5+8.0.LTS
        java-package: jdk
        architecture: x64

    - name: Handle caching of maven repository 💾
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build maven site 🏗️
      run: mvn -B -P reporting surefire-report:report site

    - name: Deploy 🚀
      uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
      with:
        branch: gh-pages
        folder: target/site
